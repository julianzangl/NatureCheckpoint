# Shared tool configuration. The components are not packaged; each has its own requirements.txt.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["grove.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ingest", "nc_sensor"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "sensor-node/tests"]
pythonpath = ["backend", "sensor-node"]
addopts = "--import-mode=importlib"
