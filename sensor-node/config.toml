# Sensor-node settings that are not secrets (decision D17). Secrets and hosts are in .env.

# Walk-condition thresholds (#7). Ranges are inclusive: [low, high].
# A value inside "good" is good, inside "fair" (but not "good") is fair, anything else is poor.
# The worst sensor decides the rating. Light is context only and is not rated.
# Initial values from docs/architecture.md; calibrate them on site.

[conditions.temperature]
unit = "°C"
good = [15.0, 25.0]
fair = [8.0, 30.0]

[conditions.humidity]
unit = "%"
good = [30.0, 70.0]
fair = [20.0, 85.0]

# Status LED (#8). Pins are BCM GPIO numbers; a Grove port Dn carries GPIO n and n+1.
# type: "single" (one LED), "traffic" (green/yellow/red LEDs), "rgb" (RGB LED), "none".
# Change to the module in the kit and document it in wiki/Hardware-and-Wiring.md.
[led]
type = "single"
pins = { led = 16 }
# traffic example: pins = { green = 16, yellow = 22, red = 5 }
# rgb example:     pins = { red = 16, green = 22, blue = 5 }
# active_high = false  # only for common-anode RGB LEDs

# Light levels (#5). Values are the Grove light sensor reading, 0 (dark) to 1000 (full scale).
# Below dark_below is "dark", above sun_above is "sun", in between is "shade".
# Initial estimates: measure dark, room light and sunlight on site with
# `python -m nc_sensor.sensors.light` and note the results in wiki/Hardware-and-Wiring.md.
[light]
dark_below = 100
sun_above = 600

# Grove 16x2 LCD on an I2C port (address 0x3E): shows the rating and check-in feedback.
[lcd]
enabled = true

# NFC card readers (#9): M5Stack Unit RFID 2 at the fixed address 0x28, one per I2C bus.
# In the demo one Pi hosts both checkpoints: reader 1 on an I2C port (bus 1) is station-1,
# reader 2 on D22 (software I2C bus 3, see wiki/Hardware-and-Wiring.md) is station-2.
[nfc]
readers = [
  { bus = 1, station_id = "station-1" },
  { bus = 3, station_id = "station-2" },
]
