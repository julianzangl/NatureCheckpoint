# Mosquitto broker for NatureCheckpoint (decisions D5, D6 in docs/architecture.md).
# Every client needs a user from the password file. Create users with ./add-user.sh.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# Keeps queued QoS 1 messages for persistent sessions (mqtt-ingest) across restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
